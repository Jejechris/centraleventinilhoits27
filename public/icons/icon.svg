<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Glowing core badge -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="url(#badge)" opacity="0.9"/>

  <!-- ITS Monogram & Star Icon -->
  <g fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="270" font-size="96" letter-spacing="4">ILI</text>
    <text x="256" y="340" font-size="36" fill="url(#gold)" font-weight="800" letter-spacing="8">2027</text>
  </g>

  <!-- Central Pulse Indicator -->
  <circle cx="256" cy="72" r="16" fill="#10b981"/>
  <circle cx="256" cy="72" r="28" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6"/>
</svg>
